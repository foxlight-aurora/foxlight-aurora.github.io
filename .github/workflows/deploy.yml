name: Build & deploy

on:
  push:
    branches: [main]
  # Times are UTC, so they don't move with Finnish summer/winter time. Every 10 min from 13:00 to 07:59, the hours it
  # can be dark in Oulu at some time of year (15:00–09:59 Finnish winter time); hourly in the hours it never is.
  # Off the hour because GitHub delays busy slots. GitHub runs schedules late or not at all, so an external timer
  # also triggers workflow_dispatch on the same pattern (see README). Runs don't wait for each other (see below).
  schedule:
    - cron: "3-59/10 13-23 * * *"
    - cron: "3-59/10 0-7 * * *"
    - cron: "3 8-12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Every run stands alone: no concurrency group and no "github-pages" environment check (recommended by
# actions/deploy-pages, not required). With either, one run GitHub fails to finish holds up all the others: on 9 and
# 17 Nov a deploy sat "waiting" on the environment check for days, GitHub refused to cancel it, and as the queue's
# holder it got every newer run cancelled, freezing the site until a code change stepped past it. Now a stuck or failed
# run only loses its own update; the next one, 10 minutes later, deploys regardless. Two runs rarely overlap (they
# take ~2 minutes), and if they do, the later deploy wins with data a few minutes newer. The timeouts end hung jobs.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # "" on foxlight-aurora.github.io, "/foxlight-aurora" on a project page
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
